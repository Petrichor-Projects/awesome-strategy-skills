name: Traffic Snapshot

on:
  schedule:
    - cron: "43 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Report missing traffic token
        if: ${{ env.TRAFFIC_TOKEN == '' }}
        run: |
          echo "### Traffic snapshot skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Add a repository administrator token as the TRAFFIC_TOKEN Actions secret to enable traffic retention." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture GitHub metrics
        if: ${{ env.TRAFFIC_TOKEN != '' }}
        run: python3 scripts/capture_github_metrics.py
        env:
          GITHUB_TOKEN: ${{ env.TRAFFIC_TOKEN }}

      - name: Upload snapshot
        if: ${{ env.TRAFFIC_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: traffic-snapshot-${{ github.run_id }}
          path: metrics-snapshot.json
          retention-days: 90
